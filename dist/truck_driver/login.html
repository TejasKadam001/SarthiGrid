<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarathi Grid</title>
  <link rel="icon" type="image/png" href="/assets/logo-CvxgtQq9.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --accent: #f97316;
      --card-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      font-family: 'Outfit', sans-serif;
    }

    body {
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.96);
      color: var(--text);
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px;
      overflow-x: hidden;
    }

    .header-section {
      text-align: center;
      margin-top: 20px;
    }

    .logo-img {
      height: 60px;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.3));
    }

    .app-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .app-title span {
      color: var(--accent);
    }

    .app-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin: 30px 0;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px 14px 14px 44px;
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #ea580c);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.3);
      transition: all 0.2s ease;
      margin-top: 10px;
      font-family: 'Outfit', sans-serif;
    }

    .btn-login:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
    }

    .presets-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      margin-top: 24px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .presets-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .preset-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--glass-border);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .preset-badge:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent);
    }

    .preset-badge strong {
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 2px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.8;
    }

    /* Alert Boxes */
    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-bottom: 20px;
      display: none;
      font-weight: 600;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
    }
  </style>
</head>
<body>

  <div class="header-section">
    <!-- SVG Truck Icon representing Driver terminal -->
    <svg class="logo-img" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="3" width="15" height="13" fill="rgba(249,115,22,0.1)"></rect>
      <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
      <circle cx="5.5" cy="18.5" r="2.5"></circle>
      <circle cx="18.5" cy="18.5" r="2.5"></circle>
    </svg>
    <div class="app-title">Sarathi <span>Driver</span></div>
    <div class="app-subtitle">Logistics & Corridor Clearance App</div>
  </div>

  <div class="login-card">
    <div class="card-title">Sign in to Driver App</div>

    <div class="alert alert-error" id="errorBox"></div>
    <div class="alert alert-success" id="successBox"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="plateInput">Truck Plate Number</label>
        <div class="input-wrapper">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <input type="text" id="plateInput" class="form-input" placeholder="e.g. MH12YR4051" required>
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Security Passcode</label>
        <div class="input-wrapper">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Access Terminal</button>
    </form>

    <div class="presets-title">Demo Drivers Quick Access</div>
    <div class="presets-container">
      <div class="preset-badge" onclick="fillDemo('MH12YR4051')">
        <strong>MH12YR4051</strong>
        <span>Vaibhav Marne</span>
      </div>
      <div class="preset-badge" onclick="fillDemo('MH-14-TR-9102')">
        <strong>MH-14-TR-9102</strong>
        <span>Suresh Deshmukh</span>
      </div>
    </div>
  </div>

  <div class="footer-note">
    Powered by Sarathi AI Grid Logistics Engine
  </div>

  <script>
    const DRIVER_PRESETS = {
      'MH12YR4051': { driver: 'Vaibhav Marne', phone: '+919284223412', type: '12,000L Potable Water Tanker', depot: 'Hadapsar Goods Depot' },
      'MH-14-TR-9102': { driver: 'Suresh Deshmukh', phone: '+919284223412', type: '10-Ton Emergency Ration Freight', depot: 'Loni Kalbhor Freight Yard' }
    };

    function fillDemo(plate) {
      document.getElementById('plateInput').value = plate;
      document.getElementById('passwordInput').value = "12345678";
    }

    function handleLogin(e) {
      e.preventDefault();
      const rawPlate = document.getElementById('plateInput').value.trim();
      const plate = rawPlate.replace(/\s+/g, '').toUpperCase();
      const password = document.getElementById('passwordInput').value;

      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');

      errorBox.style.display = "none";
      successBox.style.display = "none";

      if (password !== "12345678") {
        errorBox.textContent = "✗ Invalid security passcode. Use passcode 12345678 for demo.";
        errorBox.style.display = "block";
        return;
      }

      // Find preset details or create mock session
      let driverDetails = null;
      for (let presetKey in DRIVER_PRESETS) {
        if (presetKey.replace(/\s+/g, '').toUpperCase() === plate) {
          driverDetails = DRIVER_PRESETS[presetKey];
          break;
        }
      }

      if (!driverDetails) {
        // Fallback dynamic registration mapping
        driverDetails = {
          driver: 'Registered Driver',
          phone: '+919284223412',
          truck: rawPlate.toUpperCase(),
          type: ' Potable Water Tanker',
          depot: 'Hadapsar Goods Depot'
        };
      } else {
        driverDetails.truck = plate;
      }

      successBox.textContent = "✓ Passcode verified. Accessing driver route and transit dashboard...";
      successBox.style.display = "block";
      
      // Store session
      localStorage.setItem('wari_truck_data', JSON.stringify(driverDetails));
      sessionStorage.setItem('wari_role', 'driver');

      setTimeout(() => {
        window.location.href = "./index.html";
      }, 800);
    }
  </script>
</body>
</html>
